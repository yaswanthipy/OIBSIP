<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="A responsive temperature converter built using HTML, CSS and JavaScript.">

    <title>Temperature Converter</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="converter-container">

        <section class="converter-card">

            <div class="header">
                <div class="temperature-icon">°</div>

                <p class="label">TEMPERATURE TOOL</p>

                <h1>Temperature<br><span>Converter</span></h1>

                <p class="description">
                    Convert temperatures between Celsius, Fahrenheit,
                    and Kelvin quickly and easily.
                </p>
            </div>

            <div class="converter-form">

                <label for="temperature">Enter Temperature</label>

                <input
                    type="number"
                    id="temperature"
                    placeholder="Enter a value"
                    step="any"
                >

                <label for="unit">Select Unit</label>

                <select id="unit">
                    <option value="celsius">Celsius (°C)</option>
                    <option value="fahrenheit">Fahrenheit (°F)</option>
                    <option value="kelvin">Kelvin (K)</option>
                </select>

                <button id="convert-btn">Convert Temperature</button>

                <p id="error-message" class="error-message"></p>

            </div>

            <div class="results">

                <h2>Conversion Results</h2>

                <div class="result-grid">

                    <div class="result-box">
                        <span>Celsius</span>
                        <strong id="celsius-result">-- °C</strong>
                    </div>

                    <div class="result-box">
                        <span>Fahrenheit</span>
                        <strong id="fahrenheit-result">-- °F</strong>
                    </div>

                    <div class="result-box">
                        <span>Kelvin</span>
                        <strong id="kelvin-result">-- K</strong>
                    </div>

                </div>

            </div>

        </section>

        <p class="footer-text">
            Built for temperature conversion task. &copy; 2024 Temperature Converter
        </p>

    </main>

    <script src="script.js"></script>

</body>
</html>
